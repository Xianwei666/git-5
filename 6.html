<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>战场突围</title>
	<style>
		*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100vh;background:#263b2c;cursor:crosshair}#hud{position:fixed;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 3px #000;font-weight:bold;font-size:18px}.box{background:#0008;padding:10px 14px;border-radius:8px}.bar{display:inline-block;width:150px;height:12px;background:#333;border-radius:8px;overflow:hidden;vertical-align:middle;margin-left:8px}.fill{display:block;height:100%;background:#34d36b;width:100%}#tip{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;font-size:24px;text-shadow:0 2px 4px #000}small{font-size:14px;color:#ddd}button{pointer-events:auto;background:#e4a52a;border:0;padding:12px 24px;border-radius:7px;font-weight:bold;font-size:16px;cursor:pointer}
	</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="box">生命 <span class="bar"><i id="hp" class="fill"></i></span>　击倒 <b id="score">0</b></div><div class="box">弹药 <b id="ammo">30</b> / ∞　<span id="status">安全区内</span></div></div>
<div id="tip"></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),hpEl=document.querySelector('#hp'),ammoEl=document.querySelector('#ammo'),scoreEl=document.querySelector('#score'),tip=document.querySelector('#tip');
let W,H,keys={},mouse={x:0,y:0,down:false},p,enemies,bullets,parts,score,ammo,hp,over,last,spawn;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
function reset(){p={x:W/2,y:H/2,a:0,s:3.3};enemies=[];bullets=[];parts=[];score=0;ammo=30;hp=100;over=false;spawn=0;tip.innerHTML='';last=performance.now();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r'&&ammo===0)ammo=30;if(over&&e.key==='Enter')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
function shoot(){if(ammo<=0||over)return;ammo--;let a=p.a+(Math.random()-.5)*.06;bullets.push({x:p.x+Math.cos(a)*22,y:p.y+Math.sin(a)*22,vx:Math.cos(a)*12,vy:Math.sin(a)*12});for(let i=0;i<4;i++)parts.push({x:p.x+Math.cos(a)*25,y:p.y+Math.sin(a)*25,vx:Math.cos(a)*3+(Math.random()-.5),vy:Math.sin(a)*3+(Math.random()-.5),life:15,col:'#ffd45a'})}
function enemy(){let side=Math.floor(Math.random()*4),e={r:15,hp:2};e.x=side%2?Math.random()*W:(side?W-20:20);e.y=side%2?(side?H-20:20):Math.random()*H;enemies.push(e)}
function update(dt){let dx=(keys.d||keys.arrowright)-(keys.a||keys.arrowleft),dy=(keys.s||keys.arrowdown)-(keys.w||keys.arrowup),n=Math.hypot(dx,dy)||1;p.x=Math.max(20,Math.min(W-20,p.x+dx/n*p.s*dt));p.y=Math.max(20,Math.min(H-20,p.y+dy/n*p.s*dt));p.a=Math.atan2(mouse.y-p.y,mouse.x-p.x);if(mouse.down)shoot();spawn-=dt;if(spawn<=0){enemy();spawn=Math.max(22,65-score*.7)}
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);enemies.forEach(e=>{let a=Math.atan2(p.y-e.y,p.x-e.x),d=Math.hypot(p.x-e.x,p.y-e.y);e.x+=Math.cos(a)*1.05*dt;e.y+=Math.sin(a)*1.05*dt;if(d<28){hp-=.22*dt;if(hp<=0){over=true;tip.innerHTML='你已被淘汰<br><small>按 Enter 重新开始</small>'}}});bullets.forEach(b=>enemies.forEach(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<e.r){e.hp--;b.x=-999;if(e.hp<=0){score++;for(let i=0;i<8;i++)parts.push({x:e.x,y:e.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25,col:'#ff6b35'})}}}));enemies=enemies.filter(e=>e.hp>0);parts.forEach(z=>{z.x+=z.vx*dt;z.y+=z.vy*dt;z.life-=dt});parts=parts.filter(z=>z.life>0);hpEl.style.width=Math.max(0,hp)+'%';ammoEl.textContent=ammo;scoreEl.textContent=score}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#294d31';x.fillRect(0,0,W,H);x.strokeStyle='#39633d';x.lineWidth=2;for(let i=0;i<W;i+=55){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=55){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.fillStyle='#555';for(let i=0;i<10;i++){let xx=(i*173+80)%W,yy=(i*97+50)%H;x.fillRect(xx,yy,45,25)}bullets.forEach(b=>{x.fillStyle='#ffe28a';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});enemies.forEach(e=>{x.fillStyle='#b93434';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#222';x.fillRect(e.x-7,e.y-4,14,5)});parts.forEach(z=>{x.globalAlpha=z.life/25;x.fillStyle=z.col;x.fillRect(z.x,z.y,5,5);x.globalAlpha=1});x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='#327ad1';x.beginPath();x.arc(0,0,16,0,7);x.fill();x.fillStyle='#222';x.fillRect(8,-4,25,8);x.restore();x.strokeStyle='#fff';x.beginPath();x.arc(mouse.x,mouse.y,8,0,7);x.moveTo(mouse.x-13,mouse.y);x.lineTo(mouse.x+13,mouse.y);x.moveTo(mouse.x,mouse.y-13);x.lineTo(mouse.x,mouse.y+13);x.stroke()}
function loop(t){if(!over){let dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}}reset();
</script></body></html>
