<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>一头猪</title>
	<style>
		html, body { height: 100%; margin: 0; }
		body { display: grid; place-items: center; background: #dff4ff; }
		svg { width: min(90vw, 720px); height: auto; }
	</style>
</head>
<body>
	<svg viewBox="0 0 800 560" role="img" aria-label="一头可爱的粉色猪">
		<rect width="800" height="560" rx="28" fill="#dff4ff"/>
		<ellipse cx="400" cy="455" rx="250" ry="35" fill="#b9dce8" opacity=".65"/>
		<!-- tail -->
		<path d="M637 304c65-45 86 12 47 35-24 14-35-8-16-19 19-11 32 7 19 18" fill="none" stroke="#e9879c" stroke-width="18" stroke-linecap="round"/>
		<!-- body -->
		<ellipse cx="420" cy="325" rx="220" ry="135" fill="#f49aae" stroke="#9d5368" stroke-width="7"/>
		<ellipse cx="335" cy="330" rx="95" ry="75" fill="#f8b0bf" opacity=".65"/>
		<!-- legs -->
		<path d="M270 400v60h45v-65M475 400v60h45v-65" fill="#f49aae" stroke="#9d5368" stroke-width="7" stroke-linejoin="round"/>
		<!-- head -->
		<circle cx="225" cy="275" r="145" fill="#f49aae" stroke="#9d5368" stroke-width="7"/>
		<!-- ears -->
		<path d="M125 170c-45-58 7-107 66-44l16 54z" fill="#f49aae" stroke="#9d5368" stroke-width="7"/>
		<path d="M282 180c47-58 91-14 52 48l-49 8z" fill="#f49aae" stroke="#9d5368" stroke-width="7"/>
		<!-- eyes -->
		<circle cx="175" cy="245" r="14" fill="#4a2833"/>
		<circle cx="273" cy="245" r="14" fill="#4a2833"/>
		<circle cx="179" cy="241" r="5" fill="white"/>
		<circle cx="277" cy="241" r="5" fill="white"/>
		<!-- snout -->
		<ellipse cx="225" cy="322" rx="72" ry="53" fill="#f8b0bf" stroke="#9d5368" stroke-width="6"/>
		<ellipse cx="200" cy="320" rx="11" ry="17" fill="#9d5368"/>
		<ellipse cx="250" cy="320" rx="11" ry="17" fill="#9d5368"/>
		<path d="M211 348q14 13 28 0" fill="none" stroke="#9d5368" stroke-width="5" stroke-linecap="round"/>
		<!-- cheek marks -->
		<path d="M115 300l-25-6M118 317l-27 4M335 300l25-6M332 317l27 4" stroke="#d8758d" stroke-width="6" stroke-linecap="round"/>
	</svg>
</body>
</html>
